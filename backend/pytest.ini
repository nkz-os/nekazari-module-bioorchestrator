[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    network: hits external services
    prod_readonly: compares against a deployed instance through its public GET API (opt-in, see tests/kg/test_equivalence_prod.py)
    real_batch: runs the real extrapolate_varieties_batch (opts out of the per-crop stand-in)
addopts = -m "not network and not prod_readonly"
