          0,96 x 860 kg MS de grano/t = 825,6 kg). Con los extremos 28 y 40 saldría
          0,85 % y 2,30 %; con los 30 kg N/t de promedio que cita el texto de la guía,
          1,09 %. Resultado sensible a ese rango; contraste con un análisis de su
