# GENVCE source contract (reads the raw rows of app.kg.adapters.genvce).
#
# Raw layer: the LLM extraction pass of 2026-06-15 (52 files, one per campaign and crop group), read
# at the pinned commit of the private raw-data repository. It is the pass the production graph was
# built from (via its converter and "adequate" steps). The legacy "enriched" pass is NOT read: it is an
# older extraction (2026-06-01) with no explicit version, and 505 of its 1105 keys shared with this
# pass have another yield (rebuild inventory, 2.3). Loading it needs its own contract and version.
#
# What a row is. GENVCE publishes the mean of a GROUP of trials per table: an agroclimatic zone, a
# yield stratum, a geographic group, or all trials. It prints no trial location (trial_location is
# null in 3862 of 3862 extracted rows). The unit's site is therefore the OBSERVED group label, kept as
# an aggregate site with no coordinates (sites.yaml, ES-GENVCE-*); a table with no label has no site.
# The legacy step mapped these means to four reference cities; that is not repeated here.
#
# The extraction's own table number is the unit's row_discriminator: the same variety is printed in
# several tables of one report (different groups, periods or cycle panels) and 688 key conflicts
# appear without it. It is the extraction's number, not always the PDF's (checked: the 2011 maize
# tables are shifted by one).
#
# Adapter decisions (reported as warnings by the adapter, counted in the equivalence report):
#   irrigation  only what the zone label states; the extraction's regime is an assumption that the
#               reports do not support (the 15 maize reports never mention irrigation)
#   zone        yield_notes.zone (the table's own label) wins over the extraction's agroclimatic relabel
#   disease     bare oidio/roya_parda/helmintosporiosis/rincosporiosis are 0-9 scores in 2005/06-2011/12
#               (their tables print "Escala visual 0-9"); unresolved elsewhere, so ignored below
#   season      the report year, or the printed multi-year period (yield_notes.year_range / periodo)
source_id: GENVCE
raw:
  repo: nkz-data-sources
  paths: ["genvce/data/extractions/*.json"]
  extraction_version: "nkz-data-sources@798a73db5436eccf0ac8d4e40c7d66949195566a; extraction pass 2026-06-15 (deepseek-chat)"
adapter: app.kg.adapters.genvce
document:
  title: {from: doc.title}
  issue: {from: doc.issue}
  year: {from: doc.year}
  locator:
    - {label: page, from: table.page}
    - {label: table, from: table.number}
study:
  type: variety
  group_by: [doc.topic, table.number]
unit:
  fields:
    crop: {from: crop}
    variety: {from: variety}
    site: {from: zone}
    season: {from: season}
    irrigation: {from: irrigation, vocab: irrigation}
    production_system: {from: production_system, vocab: production_system}
    row_discriminator: {from: table.number}
  factors:
    # the group label the table prints for the variety panel ("Cebada de ciclo largo", "Maíz ciclo 700"):
    # two panels of one crop are different results, so the label is part of the unit
    - {factor: crop_group, from: crop}
  purpose:
    by_crop:
      HORVX: &cereal_purpose
        default: grain
        justification: >-
          Informe GENVCE cereales de invierno 2022/2023, Tabla 17: "Resultados del análisis de varianza de la
          variable producción de grano en cebada de invierno"
      TRZAX: *cereal_purpose
      ZEAMX:
        default: grain
        justification: >-
          Informe GENVCE maíz 2023: "EVALUACIÓN AGRONÓMICA DE LAS NUEVAS VARIEDADES CONVENCIONALES Y
          TRANSGÉNICAS DE MAÍZ PARA GRANO"
      BRSNN:
        default: grain
        justification: >-
          Informe GENVCE colza de otoño 2021/2022, section 2.2.1: "Producción de grano"
  yield:
    from: yield_kg_ha
    unit: kg/ha
    metric:
      by_crop:
        HORVX: &cereal_metric
          default: grain
          justification: >-
            Informe GENVCE cereales de invierno 2022/2023, Tabla 46: "producción de grano en trigo blando de
            ciclo largo" and Tabla 17 "producción de grano en cebada de invierno"
        TRZAX: *cereal_metric
        ZEAMX:
          default: grain
          justification: >-
            Informe GENVCE maíz 2025, Tabla 7: "Resultados del análisis de varianza de producción de grano en
            maíz de ciclo FAO 600 y 700"
        BRSNN:
          default: grain
          justification: >-
            Informe GENVCE colza de otoño 2021/2022, Tabla 11: "Resultados del análisis de varianza de
            producción de grano en colza de otoño"
    basis:
      default: standard_moisture
      justification: >-
        Every GENVCE yield table states its moisture: "kg/ha al 13% de humedad" (cereals, e.g. cereales
        2022/2023), "kg/ha al 14% de humedad" (maize, e.g. maíz 2023), "kg/ha al 9% de humedad" (rapeseed,
        e.g. colza 2021/2022); the percentage differs by crop and is given under moisture_pct
    moisture_pct:
      by_crop:
        HORVX: &cereal_moisture
          default: 13
          justification: >-
            Informe GENVCE cereales de invierno 2022/2023, cebada de invierno: "MEDIA 4639 kg/ha al 13% de
            humedad"; the same footer in every cereal report checked (2005/06 to 2024/25, organic wheat included)
        TRZAX: *cereal_moisture
        ZEAMX:
          default: 14
          justification: >-
            Informe GENVCE maíz 2023: "Media del ensayo (kg/ha) 14338 kg/ha al 14% de humedad"; the same
            footer in every maize report checked (the 2025 report also prints 9% in 22 footers of per-trial tables,
            while its summary tables, which are the extracted ones, say "kg/ha, 14% de humedad")
        BRSNN:
          default: 9
          justification: >-
            Informe GENVCE colza de otoño 2021/2022: "Media 3912 kg/ha al 9% de humedad"; the same footer in
            every rapeseed report checked
