ignore:
  - {field: confidence, reason: "self-assessment of the language model that extracted the row; not an observation of the trial"}
  - field: special_status
    reason: >-
      variety descriptor printed beside the name (check, GM, hybrid type, Clearfield); no registered variable
      models the status of a variety entry, so it is not mapped (variety and entry attributes are F2 work)
  - field: disease_scores.helmintosporiosis
    reason: >-
      bare key of the 2023/24 report, which prints "Nivel de ataque de enfermedades (% o escala 1-10)" and the
      unit per table; the extraction did not record which, so the scale is unresolved and nothing is mapped
  - field: disease_scores.helmintosporiosis_scale
    reason: >-
      key of the 2024/25 report, which prints "(% o escala 1-10)" per table; the range is not recorded by the
      extraction, so the scale is unresolved
  - field: disease_scores.roya_amarilla
    reason: >-
      bare key of the 2019/20 and 2020/21 reports: the first prints yellow rust in "(%)" in the spring wheat
      table, the second "(0-9)" in the winter wheat table, and the extraction did not record which table a
      row's value came from, so the scale is unresolved
  - field: agronomic_traits.capacidad_ahijamiento_plantas_m2
    reason: >-
      tillering capacity per plants/m2; the same trait is mapped as ears/m2 (spike_density) elsewhere and
      nothing states that plants and ears are interchangeable
  - field: yield_notes.indice_productivo_conjunto_pct
    reason: yield index of the variety in the multi-year table, copied onto this row by the extraction; it belongs to that table's unit
  - field: yield_notes.produccion_conjunta_kg_ha
    reason: yield of the variety in the multi-year table, copied onto this row by the extraction; it belongs to that table's unit
  - field: yield_notes.indice_tabla9_pct
    reason: yield index of the variety in another table of the report (Tabla 9), copied by the extraction; it belongs to that table's unit
  - field: yield_notes.produccion_tabla9_kg_ha
    reason: yield of the variety in another table of the report (Tabla 9), copied by the extraction; it belongs to that table's unit
  - field: yield_notes.tercil_superior
    reason: number of trials in which the variety ranked in the upper tercile (a tercile analysis table); no registered variable models it
  - field: yield_notes.tercil_mediano
    reason: number of trials in which the variety ranked in the middle tercile (a tercile analysis table); no registered variable models it
  - field: yield_notes.tercil_inferior
    reason: number of trials in which the variety ranked in the lower tercile (a tercile analysis table); no registered variable models it
  - field: yield_notes.rendimiento_al_9_pct_humedad
    reason: boolean note that the yield is at 9% moisture; the basis is declared once for the whole source above (rapeseed, 9%)
sites:
  # every GENVCE site is an aggregate (zone, stratum, group): none may ever resolve to a field site
  aggregate_patterns: ["^.+$"]
expected:
  units: 3862
  observations: 19813
  sites: 44
