# Water-stress reference: non-water-stressed baselines (NWSB), upper limits and stage flags.
#
# Purpose: published reference values for the crop water stress index (CWSI), served per species
# by the water-stress API. Numbers only; see source_id and ref on every row for the citation.
# No text, tables or figures of the papers are stored here.
#
# Baseline: Tc - Ta = a0_c + a1_c_per_kpa * VPD (degrees C; kPa). Upper limit (upper): `constant`
# (value_c, degrees C) or `linear_vpd` (a0_c + a1_c_per_kpa * VPD); null when the source publishes
# none. The Idso 1981 upper-limit formula was not found in any source read, so no such form exists.
#
# Serving: only rows with evidence primary_read AND a non-null upper are served. Rows without an
# upper limit, and secondary rows, are kept as data but are not served (no CWSI without an upper limit).
#
# Licences: FAO papers (fao33) are used with commercial_use unknown, pending the FAO reply.
# Other journal sources are registered with commercial_use unknown (numbers and citations only).
#
# Stage names are those of stage_detection in phenology_sources.yaml.
# ASSUMPTION: Idso 1982 "pre-heading" = emergence, tillering, stem_elongation; "post-heading" =
#   heading, maturity (heading goes with post-heading because Idso attributes the slope change to
#   seedheads; the exact boundary at heading is not published).
# ASSUMPTION: Idso 1982 maize "no tassels" = emergence, vegetative_v6 (no baseline from silking on).
# ASSUMPTION: Bellvert 2015 Stage I = vegetative; Stage II-III (one line in the paper) = veraison,
#   maturity; postharvest = post_harvest.
# Idso rows for species with one line only (no phase split in the paper) apply to all stages.
dataset_version: "2026-11-03"

