  # ── GENVCE zones, strata and groups (aggregates, never coordinates) ───────────────────────────
  # A GENVCE report prints the mean of a GROUP of trials (an agroclimatic zone, a yield stratum, a
  # geographic group, or all trials): no trial location is printed. Each label below is one such
  # group, exactly as the extraction wrote it; a label that differs only in case or spacing is the
  # same entry (lookups fold them), any other difference is a different entry: no label is merged
  # with another by similarity. The composition of a group differs per report and year.
  - id: ES-GENVCE-CENTRO
    name: Centro
    site_kind: aggregate
    country: ES
    sources: [GENVCE]
    status: assumption
    note: &genvce_geo_note >-
      ASSUMPTION: a geographic group of trials as the GENVCE maize tables print it ("zona Norte / Centro /
      Sur"); the trials it covers differ per report (for example Ebro valley and Catalonia in one report,
      Aragon, Castilla y Leon and Navarra in another). An aggregate, no coordinates.
  - id: ES-GENVCE-CONJUNTO-FRIAS-Y-TEMPLADAS
    name: Conjunto Frías y Templadas
    site_kind: aggregate
    country: ES
    sources: [GENVCE]
