# Site registry: canonical sites with aliases, kind, country and published coordinates. `id` is the
# stable site key units link to. Coordinates are as published or a municipality-level geocode, never
# a farm coordinate; they stay null when no registry has them. Aggregates and regions carry none.
#
# Scope: the sites of the licensed sources (GENVCE, CREA). Sites of other sources are added with their
# contract. GENVCE prints no trial location: its rows are means of a zone, a yield stratum, a
# geographic group or all trials, so every GENVCE site here is an aggregate (ES-GENVCE-*, no
# coordinates). The four reference cities below (Valladolid, Lleida, Cordoba, Lugo) are what the
# legacy adequacy step assigned to those means; no contract uses them any more. NOT registered, on purpose:
#   - Fundulea (Romania): the 19 rows stored under CREA are Romanian wheat from an unlicensed paper,
#     not CREA data, and are out of scope.
#   - Foggia: its three rows come from a placeholder test file, not from a trial report.
#
# status: reviewed = confirmed by a person; assumption = recorded with the reason in `note`.
version: 1
sites:
  - id: ES-VALLADOLID
    name: Valladolid
    site_kind: field
    country: ES
    sources: []
    status: assumption
    note: >-
      ASSUMPTION: kept as a field site only because the legacy graph links GENVCE trials to it. The GENVCE
      raw rows carry NO trial location; they are means of zones, strata and groups, and the legacy
      adequacy step assigned this reference city to them. No contract uses this site any more: the GENVCE
      contract puts the observed zone or stratum label in the unit's site, registered as an aggregate
      (ES-GENVCE-*). Valladolid (GENVCE) and Zamadueñas (ITACyL farm) are NOT merged: nothing in the
      licensed data says they are the same place.
  - id: ES-LLEIDA
    name: Lleida
    site_kind: field
    country: ES
    sources: []
    status: assumption
    note: "ASSUMPTION: a reference city the legacy adequacy step assigned to GENVCE zone means; no contract uses it (see ES-VALLADOLID)."
  - id: ES-CORDOBA
    name: Córdoba
    site_kind: field
    country: ES
    latitude: 37.88
    longitude: -4.77
    coordinate_source: municipality-level entry of trial_site_geo_registry.json
    sources: []
    status: assumption
    note: "ASSUMPTION: a reference city the legacy adequacy step assigned to GENVCE zone means; no contract uses it (see ES-VALLADOLID)."
  - id: ES-LUGO
    name: Lugo
    site_kind: field
    country: ES
    sources: []
    status: assumption
    note: "ASSUMPTION: a reference city the legacy adequacy step assigned to GENVCE zone means; no contract uses it (see ES-VALLADOLID)."
  - id: ES-ZAMADUENAS
    name: Zamadueñas
    site_kind: field
    country: ES
    aliases: [Zamadueñas (Valladolid)]
    latitude: 41.71306
    longitude: -4.6975
    coordinate_source: GENVCE results map, localidad record id 247 (download 2026-10-19), rounded to 5 decimals
    sources: [GENVCE-TRIALS]
    status: assumption
    note: >-
      ASSUMPTION: a separate site, not an alias of Valladolid (see ES-VALLADOLID). trial_site_geo_registry.json
      holds two entries for it about 45 km apart, which cannot both be right; the coordinates registered here
      are the ones the GENVCE results map publishes for its locality (field or municipality unconfirmed).
      Reused by GENVCE-TRIALS because the site index refuses a second entry with this name.
  - id: IT-VILLAFRANCA-PIEMONTE
    name: Villafranca Piemonte (TO)
    site_kind: field
    country: IT
    aliases: [Villafranca Piemonte]
    latitude: 44.78824
    longitude: 7.50788
    coordinate_source: municipality geocode in trial_site_geo_registry.json
    elevation_m: 253.0
    municipality: Villafranca Piemonte
    attribute_sources:
      elevation_m: >-
        trial_site_geo_registry.json, entry "villafranca piemonte (to)" (elevationM 253.0, geoSource "open-meteo
        geocoding: Villafranca Piemonte, IT")
      municipality: >-
        trial_site_geo_registry.json, entry "villafranca piemonte (to)" (resolvedName "Villafranca Piemonte",
        geoSource "open-meteo geocoding: Villafranca Piemonte, IT")
    sources: [CREA]
    status: assumption
    note: Named as published in the CREA booklets (Piedmont trial of the national maize network).
  - id: IT-CREA-AVG-8
    name: Media 8 Località
    site_kind: aggregate
    country: IT
    sources: [CREA]
    status: assumption
    note: Average over the 8 locations of that year's CREA network; the location set differs per year.
  - id: IT-CREA-AVG-10
