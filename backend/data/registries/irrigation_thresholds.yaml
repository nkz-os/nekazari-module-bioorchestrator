# Per-crop yield cutoffs that derive an irrigation regime where the source states none (owner decision of
# 2026-10-06: GENVCE and CREA rows mostly print no regime, and the extraction's own regimes were assumptions).
#
# Rule (method yield_threshold_v1, applied by the contract engine, never by an adapter):
#   source states a regime        -> that regime, always; this file is not consulted
#   source silent, yield <= low   -> rainfed
#   source silent, yield >= high  -> irrigated
#   source silent, in between     -> no regime, gap `irrigation_ambiguous_yield`
#   no yield, or no cutoff for the crop -> no regime
# The derived regime goes on the unit's canonical irrigation_regime only; raw_irrigation stays empty (so
# the unit key never changes) and the unit records `irrigation_derivation: yield_threshold_v1` with the
# two values used, so a derived regime is never mistaken for an observed one.
#
# Values are kg/ha at the standard moisture the sources state. They are calibrated, per crop, on the rows
# whose regime the source itself states (zone label, agronomic sheet), never on the rows they are then
# applied to. A crop with fewer than 15 labelled rows in a regime is NOT calibrated: it has no cutoff and
# says why. Climate and zone differences are out of scope: one pair per crop.
#
# status: assumption = calibrated but not approved; owner_approval stays empty until the owner signs the
# values off. not_calibrated = no cutoff (and no regime is derived for the crop), with the reason. Even with
# cutoffs, a group the source defines by yield or by mixed regimes never gets a derived regime (contract
# `not_derivable_when`).
version: 1
method: yield_threshold_v1
thresholds:
- crop: ZEAMX
  status: not_calibrated
  owner_approval: null
  evidence:
    method: per-class tail error, rounded outward
    epsilon: 0.05
    labelled_sources:
    - CREA
    n_rainfed: 0
    n_irrigated: 149
    rainfed_quantiles: {}
    irrigated_quantiles:
      p05: 11890.0
      p25: 13250.0
      p50: 14420.0
      p75: 17400.0
      p95: 19290.0
    reason: 'fewer than 15 labelled rows with a yield in rainfed (rainfed 0, irrigated 149): nothing to calibrate
      on, no cutoff is invented'
    raw_data_commit: 798a73db5436eccf0ac8d4e40c7d66949195566a
- crop: HORVX
  status: not_calibrated
  owner_approval: null
  evidence:
    method: per-class tail error, rounded outward
    epsilon: 0.05
    labelled_sources:
    - GENVCE
    n_rainfed: 122
    n_irrigated: 30
    rainfed_quantiles:
      p05: 3312.0
      p25: 4157.0
      p50: 4997.0
      p75: 5779.0
      p95: 6984.0
    irrigated_quantiles:
      p05: 6404.0
      p25: 6995.0
      p50: 7460.0
      p75: 10406.0
      p95: 11516.0
    separation: 0.958
    misclassified_rainfed: 6
    misclassified_irrigated: 1
    n_ambiguous: 11
    error_rate: 0.0461
    decided_error_rate: 0.0496
    max_decided_error: 0.2
    reason: 'a cutoff fitted on the rows whose regime the source states does not hold out of sample: validated by
      leaving each campaign out, it misjudges rainfed rows of good-yield campaigns as irrigated, and most campaigns
      have no labelled row to check against; yield mostly separates good campaigns from bad ones here, not
      rainfed from irrigated. The in-sample figures above are kept as evidence only'
    raw_data_commit: 798a73db5436eccf0ac8d4e40c7d66949195566a
- crop: TRZAX
  status: not_calibrated
