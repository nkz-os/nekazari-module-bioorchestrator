# Source registry: holder, structured licence and mandatory attribution per data source.
#
# `commercial_use` is the gate's only licence input: a source can be loaded into a production-targeted
# build ONLY when it is `allowed` or `permission_granted`. Today that is GENVCE, CREA and the six
# nutrient-balance reference sources. Everything else is `denied` (terms prohibit or reserve commercial
# reuse) or `unknown` (ambiguous, unreadable or not audited): both block loading until a written permission
# or a clear licence is recorded.
#
# Evidence: internal licence audit of 2026-10-04/05 (literal quotes, original language). `checked_at` is
# the date the verdict was established. `tdm_reserved` is null when text-and-data-mining rights were not
# assessed. `attribution_text` is the mandatory citation shown next to every datum; for GENVCE it is the
# literal form the reuse notice requires, with the real download date. The attribution fields of every
# loadable source equal the ones in sources_registry.json (attribution patch); that file is generated from
# this one or retired in F2.
