# GENVCE climatic zone definitions, as the reports themselves publish them (T11c).
#
# Purpose: match the GENVCE zone means to a parcel by the report's OWN climatic definition of its zones,
# applied to the parcel's climate (CHELSA v2.1 1981-2010 climatology: April mean air temperature and annual
# precipitation of the parcel's 30 arc-second cell). GENVCE classifies a trial by the weather of its campaign;
# a parcel is classified here by its climatology: the answer states that (zone_match_basis) and never hides it.
#
# What is NOT here, on purpose (those units fall back to the country-level tier, labelled):
#   * winter cereals 2005/06-2010/11: the zone also needs a realised yield (> 3500 kg/ha) and an April limit of
#     12 C: circular with the result, not a climate definition.
#   * maize (every campaign) and rapeseed 2017/18 onwards: the reports name warm/temperate/cold zones but print no
#     threshold in the text.
#   * sunflower: no unit in the graph.
#
# Each definition is one report (campaign) with its citation (PDF page of section 2.1.3 "Zonas de experimentacion"
# and of Table 3, which lists the zones the tables of that report use). Thresholds are copied from that text.
# `axes` are the classes a label must state for a unit to be zone-matched; a label that states less stays at the
# country level. A label entry constrains every class its text states (checked at load, see zone_definitions.py);
# `except_tables` removes tables whose label contradicts the printed table title.
version: 1
source_id: GENVCE
document_families:
  - {family: winter_cereals, title_prefixes: ["GENVCE Informe Anual", "GENVCE Cereales de Invierno"]}
  - {family: oilseeds, title_prefixes: ["GENVCE Oleaginosas"]}

thresholds:
  # April mean temperature, degrees C (cereals: 11 / 13)
  temp_11_13: &temp_11_13
    - {class: cold, max: 11, max_inclusive: false}
    - {class: temperate, min: 11, min_inclusive: true, max: 13, max_inclusive: true}
    - {class: warm, min: 13, min_inclusive: false}
  # annual precipitation, mm (cereals: 500 / 700; exactly 700 is in neither printed class: unclassified)
  rain_500_700: &rain_500_700
    - {class: semiarid, max: 500, max_inclusive: true}
    - {class: subhumid, min: 500, min_inclusive: false, max: 700, max_inclusive: false}
    - {class: humid, min: 700, min_inclusive: false}
  # rapeseed 2010-2017: April < 12 cold, above temperate (exactly 12 unclassified); rain <= 600 arid/semiarid, > 600 humid
  temp_12: &temp_12
    - {class: cold, max: 12, max_inclusive: false}
    - {class: temperate, min: 12, min_inclusive: false}
  rain_600: &rain_600
    - {class: arid_semiarid, max: 600, max_inclusive: true}
    - {class: humid, min: 600, min_inclusive: false}

label_sets:
  # zone labels as the graph holds them (verbatim, folded for case/accents) and the classes each one states
  cereal_t_and_r: &cereal_t_and_r
    - {label: "Zona Fría Semiárida", temperature: [cold], rainfall: [semiarid]}
    - {label: "Zona Cálida Semiárida", temperature: [warm], rainfall: [semiarid]}
  cereal_t: &cereal_t
    - {label: "Zona Fría", temperature: [cold]}
    - {label: "Zona Templada", temperature: [temperate]}
    - {label: "Zona Cálida", temperature: [warm]}
    - {label: "Zonas frías", temperature: [cold]}
    - {label: "Zonas templadas", temperature: [temperate]}
    - {label: "Zonas cálidas", temperature: [warm]}
    - {label: "Templada", temperature: [temperate]}
    - {label: "Templada y Fría", temperature: [temperate, cold]}
    - {label: "Conjunto Frías y Templadas", temperature: [cold, temperate]}
    - {label: "Zonas frías y templadas", temperature: [cold, temperate]}
    - {label: "Zonas templadas y frías", temperature: [temperate, cold]}
    - {label: "Zona Fría Semiárida", temperature: [cold], rainfall: [semiarid]}
    - {label: "Zona Cálida Semiárida", temperature: [warm], rainfall: [semiarid]}
    # labels of the durum, triticale, oat and rye tables (and the barley/soft-wheat tables added 2026-10-08)
    - {label: "Zonas templadas y cálidas", temperature: [temperate, warm]}
    - {label: "Zonas cálidas y templadas", temperature: [warm, temperate]}
    - {label: "Zonas templadas-cálidas", temperature: [temperate, warm]}
    - {label: "Zonas templadas-frías", temperature: [temperate, cold]}
    - {label: "Zonas frías semiáridas", temperature: [cold], rainfall: [semiarid]}
    - {label: "Zonas frías subhúmedas", temperature: [cold], rainfall: [subhumid]}
    - {label: "Zonas frías húmedas y subhúmedas", temperature: [cold], rainfall: [humid, subhumid]}
    - {label: "Zonas subhúmedas cálidas", temperature: [warm], rainfall: [subhumid]}
    # NOT listed, on purpose (they stay at country level): "zonas frías y semiáridas" / "zonas frías y
    # subhúmedas" (the "y" may join two zones or qualify one), "zonas áridas templadas" ("áridas" is not one of
    # the report's rainfall classes), "zonas de regadío" (no temperature class).
  colza: &colza_labels
    - {label: "Secanos áridos y semiáridos fríos", regime: secano, temperature: [cold], rainfall: [arid_semiarid]}
    - {label: "Secanos húmedos y de alto potencial fríos", regime: secano, temperature: [cold], rainfall: [humid]}
    - {label: "Secanos húmedos y de alto potencial fríos y templados", regime: secano, temperature: [cold, temperate], rainfall: [humid]}
    - {label: "Regadíos fríos", regime: regadio, temperature: [cold], waives: [rainfall]}
    - {label: "Regadíos templados", regime: regadio, temperature: [temperate], waives: [rainfall]}
    - {label: "Regadíos fríos y templados", regime: regadio, temperature: [cold, temperate], waives: [rainfall]}

