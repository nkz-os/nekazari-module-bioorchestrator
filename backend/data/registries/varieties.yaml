# Variety registry (KG ingestion, E3).
#
# One entry per variety per crop. `status`:
#   candidate  - seeded from a raw name, one variety per name, no alias evidence
#   assumption - alias group with stated evidence, not yet reviewed by a person
#   reviewed   - confirmed by a person (none yet)
# Aliases exist ONLY where the raw data itself evidences them (see `evidence`).
# Names that differ only in spacing or punctuation (e.g. "LG30.444" / "LG 30.444") are NOT merged:
# the build writes a review queue, and a person decides. No fuzzy matching, no automatic fusion.
# Lookup: exact match after Unicode NFC, case-folding and whitespace collapsing.
# Seeded 2026-10-05 from the GENVCE and CREA raw extractions (GENVCE 2006-2025, CREA 2021-2025).
# 2026-10-08: printed typos FLAIT and LG AUSTRALIA resolved as aliases of FLAIR and LG AUSTRAL (evidence per entry).
# 2026-10-07: 82 candidates added for the varieties of the winter-cereal reports of 2016/17, 2018/19, 2019/20 and 2020/21 (one per raw name, no aliases).
version: 1
