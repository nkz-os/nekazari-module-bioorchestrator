# Plausible-value ranges, contextual (E5): crop x variable x optional conditions. The most specific
# range whose conditions all match the query wins (`Registries.range_for`); none matching means no
# check. Condition keys: irrigation, production_system, purpose (vocabulary ids) and climate_class
# (Koppen code). Every range here carries `purpose: grain` so a forage or fresh-produce yield is
# never judged against a grain envelope.
#
# ALL ranges are `assumption`: generic agronomic envelopes, deliberately wide, NOT derived from the
# trial data and NOT reviewed by an agronomist. The gate only warns on them; only a `reviewed` range
# (with a named reviewer) may produce an error. `observed` is what the GENVCE and CREA raw
# extractions hold today (2026-10-05; durum, triticale, oats and rye 2026-10-08), shown to the reviewer; it never feeds the bounds. Values are
# yields as published, at the moisture basis of the source (cereals 13%, maize 14% or 15.5%, rapeseed 9%).
#
# Data caution for the reviewer: GENVCE maize rows labelled "secano" (rainfed) hold 14,025-19,451
# kg/ha, implausible for rainfed maize and likely a labelling defect of the extraction. No rainfed
# maize range is defined, so those rows are checked against the unconditional maize envelope.
version: 1
ranges:
  - id: crop_yield.ZEAMX.grain
    crop: ZEAMX
    variable: crop_yield
    conditions: {purpose: grain}
    min: 3000
    max: 24000
    unit: kg/ha
    status: assumption
    reviewer: null
    note: pending agronomist review
    observed: {min: 10770, max: 21179, n: 1440}
