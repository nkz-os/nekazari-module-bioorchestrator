# Local scratch Neo4j for `python -m app.kg build --execute`. Sized like the production instance.
# Usage:  NEO4J_PASSWORD=<choose one> docker compose -f kg-build/docker-compose.yml up -d
# Then:   NEO4J_PASSWORD=<same> python -m app.kg build --target bolt://localhost:7687 --target-label local-1 --execute
# Pin the image by digest for a reproducible build and record it with NKZ_KG_NEO4J_IMAGE_DIGEST.
services:
  neo4j-build:
    image: ${NKZ_KG_NEO4J_IMAGE:-neo4j:5.26-community}
    ports:
      - "127.0.0.1:${NKZ_KG_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 768m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 768m
      NEO4J_db_memory_transaction_max: 64m
    volumes:
      - kg-build-data:/data
volumes:
  kg-build-data:
